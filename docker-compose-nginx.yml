version: '3.8'

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: aiyuelo-nginx
    restart: unless-stopped
    ports:
      - "2080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aiyuelo-network

networks:
  aiyuelo-network:
    driver: bridge
