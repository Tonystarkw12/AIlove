# HTTPS server (Cloudflare Full SSL mode)
server {
    listen 443 ssl;
    server_name loveai.201014.xyz;

    # Self-signed cert (Cloudflare Full mode accepts this)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Frontend static files (built)
    root /home/tony/ailove-realtime/frontend-react/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://192.168.0.14:3052/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy for chat
    location /ws/ {
        proxy_pass http://192.168.0.14:3052/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static uploads
    location /uploads/ {
        proxy_pass http://192.168.0.14:3052/uploads/;
    }

    # Music files
    location /music/ {
        proxy_pass http://192.168.0.14:3052/music/;
    }

    # Pictures
    location /pictures/ {
        proxy_pass http://192.168.0.14:3052/pictures/;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        return 200 '<h1>502 Bad Gateway</h1><p>Service temporarily unavailable. Make sure the dev servers are running.</p>';
    }
}

